name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2

jobs:
  check:
    name: Check (${{ matrix.platform }})
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-24.04
          - platform: macos-arm64
            os: macos-15
          - platform: macos-x86_64
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: check-${{ matrix.platform }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: check-${{ matrix.platform }}-
      - name: Check formatting
        run: cargo +stable fmt --all -- --check
      - name: Lint
        run: cargo +stable clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo +stable test --locked --all-targets
      - name: Build
        run: cargo +stable build --locked
      - name: Check installation and repository files
        run: |
          sh -n scripts/install.sh
          bash -n scripts/install-source.sh
          python3 scripts/verify_install.py
          python3 scripts/verify_repository.py
      - name: Exercise the terminal
        run: python3 scripts/verify_terminal.py
      - name: Check demo output
        run: ./target/debug/baseballhour --demo --once
