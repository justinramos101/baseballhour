name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: 2

jobs:
  build:
    name: Build (${{ matrix.target }})
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Install Rust
        env:
          TARGET: ${{ matrix.target }}
        run: rustup toolchain install stable --profile minimal --target "$TARGET"
      - name: Check release identity
        env:
          TAG: ${{ github.ref_name }}
        run: python3 scripts/package_release.py --tag "$TAG" --check
      - name: Test and build
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cargo +stable test --locked --target "$TARGET" --all-targets
          cargo +stable build --locked --release --target "$TARGET"
          "target/$TARGET/release/baseballhour" --demo --once
          python3 scripts/verify_terminal.py "target/$TARGET/release/baseballhour"
      - name: Package binary
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ github.ref_name }}
        run: python3 scripts/package_release.py --tag "$TAG" --target "$TARGET"
      - name: Attest release archive
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: baseballhour-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: baseballhour-*
          merge-multiple: true
          path: dist
      - name: Verify archives
        working-directory: dist
        run: sha256sum --check ./*.sha256
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/*.tar.gz dist/*.sha256 scripts/install.sh \
            --draft --verify-tag --title "Baseball Hour $TAG" --notes-file "docs/releases/$TAG.md"
          gh release edit "$TAG" --draft=false

  dispatch-npm:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Dispatch npm publication
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh workflow run npm-publish.yml --ref main --field tag="$TAG" --field publish=true
